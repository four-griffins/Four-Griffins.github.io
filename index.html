<!DOCTYPE html>
<html>
<body style='background: #202020; color: #eeeeee'>
	<h1>Emote rankinator 9000</h1>
	<p>Drag emotes to the appropriate category, then press submit</p>
	<div style="display: flex; flex-direction: row; gap: 1rem; align-items: center;">
	<button id="submit" onclick="submit()">Submit</button>
	<p id="loadingtext" style="font-style: italic"></p>
	<div id="loader"></div>
	<button id="manual" style="visibility: hidden" onclick="manualSubmit()">copy my ranking to clipboard</button>
	</div>
	<div style='display: grid; grid-template-columns: 1fr 1fr; column-gap: 1rem'>
		<span style="margin-top: 2rem;">I will die without these <span style="color: #999999">max 25</span></span>
		<span style="margin-top: 2rem;">I would prefer to keep these, but less urgently <span style="color: #999999">max 25</span></span>
		<div class="legobox" id='required' ondragover="event.preventDefault()" ondrop="drop(event, this)"></div>
		<div class="legobox" id='approved' ondragover="event.preventDefault()" ondrop="drop(event, this)"></div>
		<span style="margin-top: 2rem;">I have no opinion on these</span>
		<span style="margin-top: 2rem;">These can probably go</span>
		<div class="legobox" id='leftover' ondragover="event.preventDefault()" ondrop="drop(event, this)"></div>
		<div class="legobox" id='rejected' ondragover="event.preventDefault()" ondrop="drop(event, this)"></div>
	</div>
</body>

<style>
.legobox {
	border: 2px solid white;
	min-height: 20rem;
	display: inline;
	grid-template-columns: repeat(16, 1fr);
}

.lego {
	width: 40px;
	height: 40px;
	background: red;
	margin: 4px;
}

#submit {
	display: inline;
	background: #106020;
	color: inherit;
	border: 2px solid white;
	font-size: 1.5rem;
	padding: 10px;
	border-radius: 4px;
}

#submit:disabled {
	background: #151515;
}

span { align-self: flex-end; }

#loader {
	visibility: hidden;
	width: 24px;
	height: 24px;
	border: 2px solid #FFF;
	border-bottom-color: transparent;
	border-radius: 50%;
	animation: rotation 1s linear infinite;
}

@keyframes rotation {
	0% { transform: rotate(0deg); }
	100% { transform: rotate(360deg); }
}
</style>

<script>
async function main() {
	const response = await fetch('emotes');
	const emotes = (await response.json());

	for (let i = 0; i < emotes.length - 1; i++) {
		let img = document.createElement('img');

		if (emotes[i].animated === true) {
			img.src = `https://cdn.discordapp.com/emojis/${emotes[i].id}.gif`;
			img.style.background = '#222222';
		} else {
			img.src = `https://cdn.discordapp.com/emojis/${emotes[i].id}.jpg`;
		}

		img.className = "lego";
		img.id = i;
		img.title = emotes[i].name;
		img.draggable = true;
		img.ondragstart = (ev) => ev.dataTransfer.setData('text', ev.target.id);
		document.getElementById('leftover').appendChild(img);
	}
}

function drop(ev, el) {
	ev.preventDefault()
	const id = ev.dataTransfer.getData('text')
	if (el.id === 'required' && el.children.length >= 25) { return }
	if (el.id === 'approved' && el.children.length >= 25) { return }
	el.appendChild(document.getElementById(id))
}

String.prototype.hashCode = function() {
  var hash = 0,
	i, chr;
  if (this.length === 0) return hash;
  for (i = 0; i < this.length; i++) {
	chr = this.charCodeAt(i);
	hash = ((hash << 5) - hash) + chr;
	hash |= 0; // Convert to 32bit integer
  }
  return hash;
}

async function getAnswers() {
	const ip = await fetch('https://ident.me');
	let content = "[id]\n" + (await ip.text()).hashCode();

	for (let name of ['required', 'approved', 'leftover', 'rejected']) {
		content += '\n[' + name + ']\n' + Array.from(document.getElementById(name).children).map(el => el.id).join(' ');
	}

	return content;
}

async function submit() {

	document.getElementById('submit').disabled = true;
	document.getElementById('loader').style.visibility = 'visible';
	document.getElementById('loadingtext').innerText = "submitting...";

	const content = await getAnswers();
	console.log(content);

	const resp = await fetch(
		'https://discordapp.com/api/webhooks/1353041299413930125/xGU_Rgp53aCOqpjrNohdO4OXsia7uQ9LQtTjRRD-FeWKjQMOD9m8B77Wm5QUWyOXVERD',
		{
			method: 'POST',
			headers: { 'Content-Type': 'application/json' },
			body: JSON.stringify({ content: content }),
		}
	);

	if (resp.ok) {
	document.getElementById('loader').style.visibility = 'hidden';
	document.getElementById('loadingtext').innerText = "submission sent!";
	} else {
		document.getElementById('submit').disabled = false;
		document.getElementById('loader').style.visibility = 'hidden';
		document.getElementById('loadingtext').innerText = 'something went wrong submitting your result... try again in a few seconds, or ask 4 for help on discord';
		document.getElementById('manual').style.visibility = 'visible';
	}
}

async function manualSubmit() {
	await navigator.clipboard.writeText(JSON.stringify(await getAnswers()));
}

window.addEventListener("beforeunload", (ev) => {
	if (
		document.getElementById('required').children.length === 0 &&
		document.getElementById('approved').children.length === 0 &&
		document.getElementById('rejected').children.length === 0
	) {
		return '';
	}
	ev.preventDefault();
	return "dont do that";
});

main()
</script>
</html>
